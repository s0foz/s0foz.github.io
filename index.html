<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080909">
<title>NIGHT SIGNAL // SNAKE</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --canvas:#080909;
    --surface:#101313;
    --surface-raised:#181D1D;
    --ink:#E8F5ED;
    --ink-muted:#71807A;
    --green:#B7FF3A;
    --orange:#FF5A36;
    --orange-dark:#5A241B;
    --edge:20px;
    --display:"Arial Narrow","Roboto Condensed","Helvetica Neue",Impact,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --board:min(62vw,660px,calc(100vh - 200px));
    --pad-h:56px;
    --ease-boot:cubic-bezier(.22,1,.36,1);
    --ease-snap:cubic-bezier(.2,.8,.2,1);
    --ease-pop:cubic-bezier(.16,1,.3,1);
  }
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--canvas);color:var(--ink);
    font-family:var(--mono);font-size:11px;line-height:1.2;
    overflow-x:hidden;overflow-y:auto;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- cabinet frame ---------- */
  .frame{position:fixed;inset:var(--edge);border:2px solid var(--orange);pointer-events:none;z-index:40}
  .frame.pulse{animation:framePulse 300ms var(--ease-snap)}
  @keyframes framePulse{
    0%{transform:scale(1);opacity:1}
    42%{transform:scale(.986);opacity:.42}
    100%{transform:scale(1);opacity:1}
  }

  /* ---------- shell ---------- */
  .app{
    position:relative;z-index:1;
    min-height:100vh;min-height:100dvh;
    padding:calc(var(--edge) + 22px + env(safe-area-inset-top,0px))
            calc(var(--edge) + 24px + env(safe-area-inset-right,0px))
            calc(var(--edge) + 22px + env(safe-area-inset-bottom,0px))
            calc(var(--edge) + 24px + env(safe-area-inset-left,0px));
    display:flex;flex-direction:column;gap:22px;
  }

  /* ---------- header ---------- */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.06em}
  .brand .accent{color:var(--orange)}
  .dot{width:3px;height:3px;background:var(--green);box-shadow:0 0 0 3px rgba(183,255,58,.14);animation:blink 1.8s steps(1,end) infinite}
  @keyframes blink{0%,58%{opacity:1}59%,100%{opacity:.25}}
  .hud-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .seed{font-size:10px;letter-spacing:.08em;color:var(--ink-muted)}
  .toggle{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-height:38px;min-width:44px;padding:0 11px;
    border:2px solid var(--surface-raised);color:var(--ink-muted);
    font-size:10px;font-weight:700;letter-spacing:.1em;
    transition:border-color 120ms linear,color 120ms linear,background 120ms linear;
  }
  .toggle:hover{border-color:var(--green);color:var(--green)}
  .toggle.on{border-color:rgba(183,255,58,.5);color:var(--green)}
  .toggle:active{background:rgba(183,255,58,.12)}
  #hapticBtn{display:none}
  body.touch #hapticBtn{display:inline-flex}

  /* ---------- stage ---------- */
  .stage{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr) 250px;align-items:center;gap:32px}
  .rail{display:flex;flex-direction:column}
  .playzone{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}

  .module{margin-bottom:14px}
  .label{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--ink-muted);margin-bottom:5px}
  .value{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .value.green{color:var(--green)}
  .rowline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(232,245,237,.08)}
  .rowline:first-child{border-top:1px solid rgba(232,245,237,.08)}
  .rowline .k{font-size:10px;letter-spacing:.12em;color:var(--ink-muted)}
  .rowline .v{font-family:var(--mono);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .rowline .v.hi{color:var(--orange)}

  .live{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:10px;letter-spacing:.12em;color:var(--ink-muted)}
  .live i{display:block;width:4px;height:4px;background:var(--green);animation:blink 1.6s steps(1,end) infinite}

  .score{
    font-family:var(--mono);font-size:44px;font-weight:500;line-height:.95;
    color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }
  .score.swap{animation:swap 200ms var(--ease-pop)}
  @keyframes swap{from{transform:translateY(7px) scale(.94);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .score.bump{animation:bump 260ms var(--ease-pop)}
  @keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.12)}100%{transform:scale(1)}}

  .meter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .meter{display:flex;gap:3px}
  .meter span{flex:1;height:7px;background:var(--surface-raised);transition:background 160ms linear}
  .meter span.on{background:var(--green)}
  .meter span.hot{background:var(--orange)}

  .legend{margin-top:26px;display:flex;flex-direction:column;gap:11px}
  .legend-row{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.12em;color:var(--ink-muted)}
  .key{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:30px;min-height:23px;padding:0 8px;
    border:2px solid var(--green);color:var(--green);
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;flex:none;
  }
  .key.warn{border-color:var(--orange);color:var(--orange)}
  .key.dim{border-color:var(--surface-raised);color:var(--ink-muted)}
  .legend-touch{display:none}
  body.touch .legend-touch{display:flex}
  body.touch .legend-kbd{display:none}

  /* ---------- board ---------- */
  .board{
    position:relative;width:var(--board);height:var(--board);
    background:var(--surface);border:2px solid var(--orange);overflow:hidden;
    touch-action:none;-webkit-touch-callout:none;
  }
  .board.boot{animation:gridIn 520ms var(--ease-boot)}
  @keyframes gridIn{from{opacity:.3}to{opacity:1}}
  .board.pulse{animation:framePulse 300ms var(--ease-snap)}
  .board.flash{animation:edgeFlash 420ms var(--ease-snap)}
  @keyframes edgeFlash{0%{border-color:var(--green)}100%{border-color:var(--orange)}}
  .board-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .board::before{
    content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(232,245,237,.05) 0 1px,transparent 1px 3px);
  }
  .board::after{
    content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(circle at 50% 44%,rgba(8,9,9,0) 52%,rgba(8,9,9,.5) 100%);
  }
  .scanline{
    position:absolute;left:0;right:0;top:0;height:2px;background:var(--orange);
    opacity:.85;z-index:6;animation:scan 520ms var(--ease-boot) forwards;
  }
  @keyframes scan{from{top:0}to{top:calc(100% - 2px)}}

  /* ---------- d-pad ---------- */
  .dpad{
    display:none;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;width:min(272px,72vw);
  }
  body.touch .dpad{display:grid}
  .pad{
    height:var(--pad-h);
    border:2px solid var(--surface-raised);background:var(--surface);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;
    touch-action:none;-webkit-user-select:none;user-select:none;
    transition:transform 80ms var(--ease-snap),border-color 120ms linear,background 120ms linear,color 120ms linear;
  }
  .pad:hover{border-color:var(--ink-muted)}
  .pad:active,.pad.hit{transform:scale(.92);border-color:var(--green);background:rgba(183,255,58,.14);color:var(--green)}
  .pad.up{grid-column:2;grid-row:1}
  .pad.left{grid-column:1;grid-row:2}
  .pad.mid{grid-column:2;grid-row:2;border-color:var(--green);color:var(--green)}
  .pad.mid:active{background:rgba(183,255,58,.2)}
  .pad.right{grid-column:3;grid-row:2}
  .pad.down{grid-column:2;grid-row:3}

  /* ---------- overlay ---------- */
  .overlay{
    position:absolute;inset:0;z-index:12;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:22px;text-align:center;background:rgba(8,9,9,.72);
    -webkit-touch-callout:none;
  }
  .overlay[hidden]{display:none}
  .title{
    font-family:var(--display);font-size:78px;font-weight:900;line-height:.86;
    letter-spacing:-.02em;margin:0;color:var(--ink);
  }
  .title.danger{color:var(--orange)}
  .title.live-title{color:var(--green)}
  .title.small{font-size:58px}
  .coin{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.16em;color:var(--orange)}
  .rule-thin{width:64px;height:1px;background:var(--orange);opacity:.6}
  .action{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    border:2px solid var(--green);padding:12px 18px;min-height:50px;
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--ink);
    transition:background 120ms linear,transform 120ms var(--ease-snap);
  }
  .action:hover{background:rgba(183,255,58,.12);transform:translateY(-1px)}
  .action:active{transform:translateY(0) scale(.98);background:rgba(183,255,58,.2)}
  .action.warn{border-color:var(--orange)}
  .action.warn:hover{background:rgba(255,90,54,.12)}
  .rules{list-style:none;margin:0;padding:0;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .rules li{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-muted)}
  .rules li b{color:var(--ink);font-weight:500}
  .micro{margin:0;font-size:10px;letter-spacing:.16em;color:var(--ink-muted)}
  .final{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-muted);align-items:baseline}
  .final b{display:block;font-size:26px;font-weight:500;color:var(--ink);letter-spacing:0;margin-top:6px;font-variant-numeric:tabular-nums}
  .final .hi b{color:var(--orange)}
  .enter-hint{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--ink-muted)}
  .enter-hint .key{min-width:22px;min-height:19px;font-size:9px;padding:0 5px}

  /* ---------- responsive: tablet ---------- */
  @media (max-width:1023px){
    .stage{grid-template-columns:128px minmax(0,1fr) 190px;gap:22px}
    .title{font-size:58px}
    .title.small{font-size:44px}
    .score{font-size:36px}
    :root{--pad-h:52px}
  }

  /* ---------- responsive: phone ---------- */
  @media (max-width:767px){
    :root{
      --edge:8px;
      --board:min(calc(100vw - 34px),calc(100vh - 296px),440px);
      --pad-h:52px;
    }
    .app{gap:16px;
      padding:calc(var(--edge) + 12px + env(safe-area-inset-top,0px))
              calc(var(--edge) + 12px + env(safe-area-inset-right,0px))
              calc(var(--edge) + 18px + env(safe-area-inset-bottom,0px))
              calc(var(--edge) + 12px + env(safe-area-inset-left,0px));
    }
    .stage{display:flex;flex-direction:column;align-items:stretch;gap:16px}
    .playzone{order:1}
    .rail-left{order:2}
    .rail-right{order:3}
    .rail{flex-direction:row;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
    .module{margin-bottom:0;min-width:74px}
    .rowline{flex:1 1 118px}
    .live{margin:0}
    .legend{margin:0;flex-direction:row;flex-wrap:wrap;gap:10px 14px;width:100%}
    .title{font-size:46px}
    .title.small{font-size:34px}
    .score{font-size:38px}
    .rules{gap:12px}
    .final{gap:18px}
    .final b{font-size:22px}
    .dpad{width:min(300px,84vw)}
  }

  /* ---------- responsive: phone landscape / short viewports ---------- */
  @media (orientation:landscape) and (max-height:560px){
    :root{
      --board:min(calc(100vh - 34px),calc(100vw - 320px),420px);
      --pad-h:48px;
    }
    .app{padding-top:calc(var(--edge) + 10px + env(safe-area-inset-top,0px));padding-bottom:calc(var(--edge) + 10px + env(safe-area-inset-bottom,0px))}
    .stage{flex-direction:row;align-items:center;gap:18px}
    .playzone{flex-direction:row;order:1;flex:1}
    .rail-right{order:2;flex-direction:column;flex:0 0 190px;align-items:stretch}
    .rail-left{display:none}
    .dpad{width:196px;gap:8px}
    .title{font-size:44px}
    .title.small{font-size:32px}
    .legend{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<div class="frame" id="frame" aria-hidden="true"></div>

<div class="app">
  <header class="hud">
    <div class="brand">
      <span>NIGHT SIGNAL</span>
      <span class="accent">// SNAKE</span>
      <span class="dot" aria-hidden="true"></span>
    </div>
    <div class="hud-right">
      <button class="toggle on" id="soundBtn" type="button" aria-pressed="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z"></path>
          <path d="M17 9.5a4 4 0 0 1 0 5"></path>
          <path d="M19.5 7a7.5 7.5 0 0 1 0 10"></path>
        </svg>
        <span id="soundLabel">SOUND ON</span>
      </button>
      <button class="toggle on" id="hapticBtn" type="button" aria-pressed="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true">
          <rect x="8" y="4" width="8" height="16"></rect>
          <path d="M4 9v6"></path>
          <path d="M20 9v6"></path>
        </svg>
        <span id="hapticLabel">HAPTIC</span>
      </button>
      <div class="seed" id="seedLabel">SEED: NS-0426 / BUILD 2.1.0</div>
    </div>
  </header>

  <main class="stage">
    <aside class="rail rail-left" aria-label="Telemetry">
      <div class="module">
        <div class="label">LENGTH</div>
        <div class="value" id="lenVal">003</div>
      </div>
      <div class="module">
        <div class="label">FOOD</div>
        <div class="value" id="foodVal">00</div>
      </div>
      <div class="module">
        <div class="label">SPEED</div>
        <div class="value green" id="speedVal">1.0&times;</div>
      </div>
      <div class="module">
        <div class="label">TICK</div>
        <div class="value" id="tickVal">140ms</div>
      </div>
      <div class="live"><i aria-hidden="true"></i>SIGNAL: LIVE</div>
    </aside>

    <section class="playzone">
      <div class="board" id="board" role="img" aria-label="Snake game board">
        <canvas class="board-canvas" id="canvas"></canvas>
      </div>

      <div class="dpad" id="dpad" role="group" aria-label="Direction controls">
        <button class="pad up" type="button" data-dir="0,-1" aria-label="Steer up">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 19V6"></path><path d="M5 12l7-7 7 7"></path></svg>
        </button>
        <button class="pad left" type="button" data-dir="-1,0" aria-label="Steer left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M19 12H6"></path><path d="M12 5l-7 7 7 7"></path></svg>
        </button>
        <button class="pad mid" type="button" id="padMid" data-act="toggle" aria-label="Start game">START</button>
        <button class="pad right" type="button" data-dir="1,0" aria-label="Steer right">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M5 12h13"></path><path d="M12 5l7 7-7 7"></path></svg>
        </button>
        <button class="pad down" type="button" data-dir="0,1" aria-label="Steer down">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 5v13"></path><path d="M5 12l7 7 7-7"></path></svg>
        </button>
      </div>
    </section>

    <aside class="rail rail-right" aria-label="Score and controls">
      <div class="module">
        <div class="label">SCORE</div>
        <div class="score" id="scoreVal">000</div>
      </div>

      <div class="rowline">
        <span class="k">BEST</span>
        <span class="v hi" id="bestVal">000</span>
      </div>
      <div class="rowline">
        <span class="k">STATE</span>
        <span class="v" id="stateVal">ATTRACT</span>
      </div>
      <div class="rowline">
        <span class="k">TIER</span>
        <span class="v" id="tierVal">01 / 09</span>
      </div>

      <div class="module" style="margin-top:20px">
        <div class="meter-head">
          <span class="label" style="margin:0">ACCELERATION</span>
          <span class="label" style="margin:0" id="meterPct">0%</span>
        </div>
        <div class="meter" id="meter" aria-hidden="true"></div>
      </div>

      <div class="legend legend-kbd">
        <div class="legend-row"><span class="key">ENTER</span><span>START</span></div>
        <div class="legend-row"><span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>STEER</span></div>
        <div class="legend-row"><span class="key">P</span><span>PAUSE</span></div>
        <div class="legend-row"><span class="key">R</span><span>RESTART</span></div>
        <div class="legend-row"><span class="key dim">M</span><span>MUTE</span></div>
      </div>

      <div class="legend legend-touch">
        <div class="legend-row"><span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>SWIPE OR PAD</span></div>
        <div class="legend-row"><span class="key">TAP</span><span>PAUSE / START</span></div>
        <div class="legend-row"><span class="key dim">M</span><span>MUTE</span></div>
      </div>
    </aside>
  </main>
</div>

<div class="sr-only" id="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ================= constants ================= */
  var SIZE = 24;
  var BASE_INTERVAL = 140;
  var MIN_INTERVAL = 72;
  var STEP = 2;
  var TIER_STEP = 4;
  var MAX_TIER = 9;
  var SWIPE_MIN = 20;
  var TAP_MAX_DIST = 12;
  var TAP_MAX_TIME = 340;

  var BEST_KEY = 'nightsignal.snake.best';
  var SOUND_KEY = 'nightsignal.snake.sound';
  var HAPTIC_KEY = 'nightsignal.snake.haptic';

  var S = {
    START: 'start',
    READY: 'ready',
    RUNNING: 'running',
    PAUSED: 'paused',
    OVER: 'over'
  };

  var STATE_LABEL = {
    start: 'ATTRACT',
    ready: 'READY',
    running: 'PLAY',
    paused: 'PAUSED',
    over: 'STANDBY'
  };

  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {}

  /* ================= dom ================= */
  var body = document.body;
  var boardEl = document.getElementById('board');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var frameEl = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var padMid = document.getElementById('padMid');

  var scoreEl = document.getElementById('scoreVal');
  var foodEl = document.getElementById('foodVal');
  var speedEl = document.getElementById('speedVal');
  var bestEl = document.getElementById('bestVal');
  var tickEl = document.getElementById('tickVal');
  var lenEl = document.getElementById('lenVal');
  var stateEl = document.getElementById('stateVal');
  var tierEl = document.getElementById('tierVal');
  var meterEl = document.getElementById('meter');
  var meterPctEl = document.getElementById('meterPct');

  var soundBtn = document.getElementById('soundBtn');
  var soundLabel = document.getElementById('soundLabel');
  var hapticBtn = document.getElementById('hapticBtn');
  var hapticLabel = document.getElementById('hapticLabel');
  var seedLabel = document.getElementById('seedLabel');

  var overlayEl = document.createElement('div');
  overlayEl.className = 'overlay';
  boardEl.appendChild(overlayEl);

  var meterSegs = [];
  for (var mi = 0; mi < 12; mi++) {
    var seg = document.createElement('span');
    meterEl.appendChild(seg);
    meterSegs.push(seg);
  }

  /* ================= device detection ================= */
  var mqCoarse = null;
  try {
    mqCoarse = window.matchMedia('(pointer: coarse)');
  } catch (e) {
    mqCoarse = null;
  }

  var device = { form: 'desktop', touch: false, hasHaptics: false };

  function computeForm() {
    var w = window.innerWidth || 1024;
    if (w < 768) { return 'phone'; }
    if (w < 1024) { return 'tablet'; }
    return 'desktop';
  }

  function computeTouch() {
    var coarse = mqCoarse ? mqCoarse.matches : false;
    var points = navigator.maxTouchPoints || 0;
    if (coarse) { return true; }
    return points > 0 && window.innerWidth < 1180;
  }

  function syncDevice() {
    device.form = computeForm();
    device.touch = computeTouch();
    device.hasHaptics = typeof navigator.vibrate === 'function';

    body.classList.toggle('is-phone', device.form === 'phone');
    body.classList.toggle('is-tablet', device.form === 'tablet');
    body.classList.toggle('is-desktop', device.form === 'desktop');
    body.classList.toggle('touch', device.touch);
    body.classList.toggle('keyboard', !device.touch);

    seedLabel.textContent = 'SEED: NS-0426 / ' + device.form.toUpperCase() +
      ' / ' + (device.touch ? 'TOUCH' : 'KEYS');

    hapticBtn.style.display = (device.touch && device.hasHaptics) ? '' : 'none';
    syncToggleUI();
    updateHUD();
  }

  /* ================= canvas sizing ================= */
  var cssSize = 320;
  var cell = 13;
  var dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssSize = boardEl.clientWidth || 320;
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = cssSize / SIZE;
    draw(performance.now());
  }

  /* ================= audio ================= */
  var actx = null;
  var soundOn = true;
  try {
    soundOn = window.localStorage.getItem(SOUND_KEY) !== 'off';
  } catch (e) {}

  function warmAudio() {
    if (!soundOn) { return null; }
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        actx = null;
      }
    }
    if (actx && actx.state === 'suspended') {
      try { actx.resume(); } catch (e) {}
    }
    return actx;
  }

  function tone(freq, dur, type, vol, slideTo) {
    var a = warmAudio();
    if (!a) { return; }
    var t = a.currentTime;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) {
      o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  function noiseBurst(dur, vol, from, to) {
    var a = warmAudio();
    if (!a) { return; }
    var t = a.currentTime;
    var len = Math.max(1, Math.floor(a.sampleRate * dur));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    var src = a.createBufferSource();
    src.buffer = buf;
    var f = a.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(from || 1600, t);
    f.frequency.exponentialRampToValueAtTime(to || 140, t + dur);
    var g = a.createGain();
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(a.destination);
    src.start(t);
  }

  /* ================= haptics ================= */
  var hapticsOn = true;
  try {
    hapticsOn = window.localStorage.getItem(HAPTIC_KEY) !== 'off';
  } catch (e) {}

  function buzz(pattern) {
    if (!hapticsOn || reduceMotion || !device.hasHaptics) { return; }
    try { navigator.vibrate(pattern); } catch (e) {}
  }

  /* ================= sfx ================= */
  var sfx = {
    eat: function () {
      var step = Math.min(14, score);
      tone(360 + step * 26, 0.075, 'square', 0.05, 560 + step * 30);
      tone(180 + step * 12, 0.05, 'triangle', 0.03);
      buzz(12);
    },
    turn: function () {
      tone(1500, 0.018, 'square', 0.012);
    },
    start: function () {
      tone(330, 0.09, 'square', 0.05);
      window.setTimeout(function () { tone(660, 0.12, 'square', 0.05); }, 90);
    },
    tier: function () {
      tone(520, 0.08, 'square', 0.05);
      window.setTimeout(function () { tone(700, 0.08, 'square', 0.05); }, 75);
      window.setTimeout(function () { tone(940, 0.14, 'square', 0.055); }, 150);
      buzz([16, 32, 16]);
    },
    crash: function () {
      noiseBurst(0.42, 0.16, 2200, 90);
      tone(220, 0.36, 'sawtooth', 0.07, 52);
      buzz([30, 45, 70]);
    },
    pause: function () {
      tone(420, 0.07, 'triangle', 0.04, 260);
    }
  };

  function syncToggleUI() {
    soundBtn.classList.toggle('on', soundOn);
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundLabel.textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';

    hapticBtn.classList.toggle('on', hapticsOn);
    hapticBtn.setAttribute('aria-pressed', hapticsOn ? 'true' : 'false');
    hapticLabel.textContent = hapticsOn ? 'HAPTIC' : 'HAPTIC OFF';
  }

  function toggleSound() {
    soundOn = !soundOn;
    try {
      window.localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off');
    } catch (e) {}
    syncToggleUI();
    if (soundOn) {
      warmAudio();
      tone(660, 0.08, 'square', 0.05);
    }
  }

  function toggleHaptic() {
    hapticsOn = !hapticsOn;
    try {
      window.localStorage.setItem(HAPTIC_KEY, hapticsOn ? 'on' : 'off');
    } catch (e) {}
    syncToggleUI();
    if (hapticsOn) { buzz(18); }
  }

  /* ================= game state ================= */
  var state = S.START;
  var snake = [];
  var prevSnake = [];
  var dir = { x: 1, y: 0 };
  var queue = [];
  var food = { x: -1, y: -1 };
  var score = 0;
  var interval = BASE_INTERVAL;
  var best = 0;
  var acc = 0;
  var last = 0;
  var lastScoreShown = -1;
  var turnCooldown = 0;

  var particles = [];
  var floats = [];
  var shake = 0;
  var bloom = 0;
  var dyingTimer = 0;

  try {
    var bv = parseInt(window.localStorage.getItem(BEST_KEY), 10);
    best = isNaN(bv) ? 0 : bv;
  } catch (e) {
    best = 0;
  }

  function saveBest() {
    try {
      window.localStorage.setItem(BEST_KEY, String(best));
    } catch (e) {}
  }

  function pad(n, len) {
    var s = String(Math.max(0, n | 0));
    len = len || 3;
    while (s.length < len) { s = '0' + s; }
    return s;
  }

  function idx(x, y) { return y * SIZE + x; }
  function copy(p) { return { x: p.x, y: p.y }; }

  /* ================= setup ================= */
  function resetGame() {
    var mid = Math.floor(SIZE / 2);
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid }
    ];
    prevSnake = snake.map(copy);
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    interval = BASE_INTERVAL;
    acc = 0;
    particles.length = 0;
    floats.length = 0;
    shake = 0;
    bloom = 0;
    dyingTimer = 0;
    placeFood();
  }

  function placeFood() {
    var taken = {};
    for (var i = 0; i < snake.length; i++) {
      taken[idx(snake[i].x, snake[i].y)] = true;
    }
    var free = [];
    for (var y = 0; y < SIZE; y++) {
      for (var x = 0; x < SIZE; x++) {
        if (!taken[idx(x, y)]) { free.push({ x: x, y: y }); }
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : { x: -1, y: -1 };
  }

  /* ================= effects ================= */
  function burst(gx, gy, color, count, power) {
    if (reduceMotion) { return; }
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var sp = (0.06 + Math.random() * 0.13) * (power || 1);
      particles.push({
        x: gx + 0.5,
        y: gy + 0.5,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: 1,
        decay: 0.016 + Math.random() * 0.016,
        size: 0.1 + Math.random() * 0.2,
        color: color
      });
    }
    if (particles.length > 260) {
      particles.splice(0, particles.length - 260);
    }
  }

  function addFloat(gx, gy, text, color, scale) {
    if (reduceMotion) { return; }
    floats.push({
      x: gx + 0.5,
      y: gy + 0.2,
      text: text,
      color: color,
      life: 1,
      scale: scale || 1
    });
    if (floats.length > 8) { floats.shift(); }
  }

  function updateEffects(dt) {
    var f = dt / 16.67;

    shake = Math.max(0, shake - dt * 0.055);
    bloom = Math.max(0, bloom - dt / 420);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * f;
      p.y += p.vy * f;
      p.vx *= Math.pow(0.9, f);
      p.vy *= Math.pow(0.9, f);
      p.life -= p.decay * f;
      if (p.life <= 0) { particles.splice(i, 1); }
    }

    for (var j = floats.length - 1; j >= 0; j--) {
      floats[j].life -= 0.018 * f;
      floats[j].y -= 0.012 * f;
      if (floats[j].life <= 0) { floats.splice(j, 1); }
    }

    if (turnCooldown > 0) { turnCooldown -= dt; }
    if (dyingTimer > 0) {
      dyingTimer -= dt;
      if (dyingTimer <= 0) {
        dyingTimer = 0;
        showOverlay();
      }
    }
  }

  /* ================= drawing ================= */
  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(232,245,237,0.075)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < SIZE; i++) {
      var q = Math.round(i * cell) + 0.5;
      ctx.moveTo(q, 0);
      ctx.lineTo(q, cssSize);
      ctx.moveTo(0, q);
      ctx.lineTo(cssSize, q);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(232,245,237,0.05)';
    ctx.beginPath();
    var c = Math.round(cssSize / 2) + 0.5;
    ctx.moveTo(c - cell * 1.6, c);
    ctx.lineTo(c + cell * 1.6, c);
    ctx.moveTo(c, c - cell * 1.6);
    ctx.lineTo(c, c + cell * 1.6);
    ctx.stroke();
  }

  function drawFood(now) {
    if (food.x < 0) { return; }
    var pulse = reduceMotion ? 0.5 : (Math.sin(now / 240) * 0.5 + 0.5);
    var cx = (food.x + 0.5) * cell;
    var cy = (food.y + 0.5) * cell;

    if (!reduceMotion) {
      for (var r = 0; r < 2; r++) {
        var phase = ((now / 900) + r * 0.5) % 1;
        var rad = cell * (0.45 + phase * 1.15);
        ctx.strokeStyle = 'rgba(255,90,54,' + (0.34 * (1 - phase)).toFixed(3) + ')';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 1.9);
    glow.addColorStop(0, 'rgba(255,90,54,0.28)');
    glow.addColorStop(1, 'rgba(255,90,54,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(cx - cell * 1.9, cy - cell * 1.9, cell * 3.8, cell * 3.8);

    var s = cell * (0.3 + pulse * 0.055);
    ctx.fillStyle = '#FF5A36';
    ctx.fillRect(cx - s, cy - s, s * 2, s * 2);
    ctx.fillStyle = '#FFB9A6';
    ctx.fillRect(cx - s * 0.34, cy - s * 0.34, s * 0.68, s * 0.68);
  }

  function drawSnake(p) {
    var n = snake.length;
    var inset = Math.max(1, cell * 0.075);
    var total = Math.max(1, n - 1);

    ctx.save();
    for (var i = n - 1; i >= 0; i--) {
      var to = snake[i];
      var from = (i === 0 ? prevSnake[0] : prevSnake[Math.min(i - 1, prevSnake.length - 1)]) || to;
      var gx = from.x + (to.x - from.x) * p;
      var gy = from.y + (to.y - from.y) * p;
      var t = i / total;

      var w = (cell - inset * 2) * (1 - t * 0.16);
      var x = gx * cell + cell / 2 - w / 2;
      var y = gy * cell + cell / 2 - w / 2;

      var g = Math.round(255 - t * 46);
      var b = Math.round(58 - t * 24);
      var col = 'rgb(183,' + g + ',' + b + ')';

      if (i === 0) {
        ctx.shadowColor = 'rgba(183,255,58,0.55)';
        ctx.shadowBlur = 14 + bloom * 26;
      } else {
        ctx.shadowColor = 'rgba(183,255,58,0.16)';
        ctx.shadowBlur = 6;
      }

      ctx.fillStyle = col;
      roundRect(x, y, w, w, cell * 0.13);
      ctx.fill();
    }
    ctx.restore();

    if (n) {
      var hto = snake[0];
      var hfrom = prevSnake[0] || hto;
      var hx = hfrom.x + (hto.x - hfrom.x) * p;
      var hy = hfrom.y + (hto.y - hfrom.y) * p;
      var hw = cell - inset * 2;
      var hxp = hx * cell + cell / 2 - hw / 2;
      var hyp = hy * cell + cell / 2 - hw / 2;

      ctx.strokeStyle = '#E8F5ED';
      ctx.lineWidth = 2;
      roundRect(hxp + 1, hyp + 1, hw - 2, hw - 2, cell * 0.13);
      ctx.stroke();

      var nw = hw * 0.34;
      var nh = Math.max(2, hw * 0.13);
      var nx = hxp + hw / 2 - nw / 2;
      var ny = hyp + hw / 2 - nh / 2;

      if (dir.x === 1) { nx = hxp + hw - nh - hw * 0.12; ny = hyp + hw / 2 - nw / 2; }
      else if (dir.x === -1) { nx = hxp + hw * 0.12; ny = hyp + hw / 2 - nw / 2; }
      else if (dir.y === 1) { ny = hyp + hw - nh - hw * 0.12; }
      else { ny = hyp + hw * 0.12; }

      ctx.fillStyle = '#080909';
      if (dir.x !== 0) {
        ctx.fillRect(nx, ny, nh, nw);
      } else {
        ctx.fillRect(nx, ny, nw, nh);
      }
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      var s = pt.size * cell * (0.4 + pt.life * 0.8);
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life * 1.15));
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x * cell - s / 2, pt.y * cell - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats() {
    for (var i = 0; i < floats.length; i++) {
      var fl = floats[i];
      var alpha = Math.max(0, Math.min(1, fl.life * 1.3));
      var fs = Math.max(10, Math.round(cell * 0.62 * fl.scale));
      ctx.globalAlpha = alpha;
      ctx.font = '700 ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x * cell, fl.y * cell);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function draw(now) {
    var w = cssSize;
    ctx.save();
    if (shake > 0.05 && !reduceMotion) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    ctx.fillStyle = '#101313';
    ctx.fillRect(-20, -20, w + 40, w + 40);
    drawGrid();

    var p = 1;
    if (state === S.RUNNING) {
      p = Math.max(0, Math.min(1, acc / interval));
      if (reduceMotion) { p = 1; }
    }

    drawFood(now);
    drawSnake(p);
    drawParticles();
    drawFloats();

    ctx.restore();
  }

  /* ================= hud ================= */
  function updatePadMid() {
    if (!padMid) { return; }
    var label = 'START';
    var aria = 'Start game';
    if (state === S.RUNNING) {
      label = 'PAUSE';
      aria = 'Pause game';
    } else if (state === S.PAUSED) {
      label = 'RESUME';
      aria = 'Resume game';
    } else if (state === S.READY) {
      label = 'GO';
      aria = 'Start running';
    } else if (state === S.OVER) {
      label = 'AGAIN';
      aria = 'Restart game';
    }
    padMid.textContent = label;
    padMid.setAttribute('aria-label', aria);
    padMid.classList.toggle('warn', state === S.OVER);
  }

  function updateHUD() {
    if (lastScoreShown !== score) {
      scoreEl.textContent = pad(score);
      scoreEl.classList.remove('swap', 'bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add(reduceMotion ? 'swap' : 'bump');
      lastScoreShown = score;
    }

    lenEl.textContent = pad(snake.length);
    foodEl.textContent = pad(score, 2);
    speedEl.innerHTML = (BASE_INTERVAL / interval).toFixed(1) + '&times;';
    bestEl.textContent = pad(best);
    tickEl.textContent = Math.round(interval) + 'ms';
    stateEl.textContent = STATE_LABEL[state];

    var tier = Math.min(MAX_TIER, 1 + Math.floor(score / TIER_STEP));
    tierEl.textContent = pad(tier, 2) + ' / ' + pad(MAX_TIER, 2);

    var prog = (BASE_INTERVAL - interval) / (BASE_INTERVAL - MIN_INTERVAL);
    var filled = Math.round(prog * meterSegs.length);
    for (var i = 0; i < meterSegs.length; i++) {
      meterSegs[i].className = i < filled ? 'on' : (i === filled ? 'hot' : '');
    }
    meterPctEl.textContent = Math.round(prog * 100) + '%';

    boardEl.setAttribute(
      'aria-label',
      'Snake board. Score ' + score + '. Length ' + snake.length + '. Speed ' +
      (BASE_INTERVAL / interval).toFixed(1) + ' times. State ' + STATE_LABEL[state] + '.'
    );

    updatePadMid();
  }

  /* ================= overlay ================= */
  function isTouchMode() {
    return device.touch;
  }

  function showOverlay() {
    if (state === S.RUNNING) {
      overlayEl.hidden = true;
      overlayEl.innerHTML = '';
      return;
    }
    overlayEl.hidden = false;

    var tapWord = isTouchMode() ? 'TAP' : 'CLICK';

    if (state === S.START) {
      overlayEl.innerHTML =
        '<h1 class="title">SNAKE</h1>' +
        '<div class="rule-thin"></div>' +
        '<p class="coin">INSERT COIN</p>' +
        '<button class="action" type="button" data-act="start">' +
          (isTouchMode()
            ? 'TAP TO START'
            : 'PRESS <span class="key">ENTER</span> TO START') +
        '</button>' +
        '<ul class="rules">' +
          '<li><b>EAT</b> THE SIGNAL</li>' +
          '<li><b>AVOID</b> THE WALLS</li>' +
          '<li><b>AVOID</b> YOURSELF</li>' +
        '</ul>' +
        '<div class="enter-hint">' +
          (isTouchMode()
            ? '<span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>SWIPE THE BOARD OR USE THE PAD</span>'
            : '<span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>OR USE THE ARROW KEYS</span>') +
        '</div>';
    } else if (state === S.READY) {
      overlayEl.innerHTML =
        '<h1 class="title live-title">READY</h1>' +
        '<div class="rule-thin"></div>' +
        '<div class="enter-hint">' +
          (isTouchMode()
            ? '<span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>SWIPE OR TAP A DIRECTION</span>'
            : '<span class="key">&#8593;&#8595;&#8592;&#8594;</span><span>PRESS ANY ARROW KEY</span>') +
        '</div>';
    } else if (state === S.PAUSED) {
      overlayEl.innerHTML =
        '<h1 class="title small">PAUSED</h1>' +
        '<div class="rule-thin"></div>' +
        '<button class="action warn" type="button" data-act="resume">' +
          (isTouchMode() ? 'RESUME' : '<span class="key warn">P</span> RESUME') +
        '</button>' +
        '<p class="micro">' + tapWord + ' THE BOARD OR PRESS R TO RESTART</p>';
    } else if (state === S.OVER) {
      overlayEl.innerHTML =
        '<h1 class="title small danger">GAME OVER</h1>' +
        '<div class="rule-thin"></div>' +
        '<div class="final">' +
          '<span>SCORE<b>' + pad(score) + '</b></span>' +
          '<span class="hi">BEST<b>' + pad(best) + '</b></span>' +
          '<span>LENGTH<b>' + pad(snake.length) + '</b></span>' +
        '</div>' +
        '<button class="action" type="button" data-act="restart">' +
          (isTouchMode() ? 'TAP TO RESTART' : 'PRESS <span class="key">ENTER</span> TO RESTART') +
        '</button>';
    }
  }

  function announce(msg) {
    statusEl.textContent = msg;
  }

  /* ================= flow ================= */
  function toReady() {
    resetGame();
    state = S.READY;
    dyingTimer = 0;
    showOverlay();
    updateHUD();
    announce('Game ready. Press any arrow key.');
  }

  function startRunning() {
    if (state !== S.READY && state !== S.PAUSED) { return; }
    var fromPause = state === S.PAUSED;
    state = S.RUNNING;
    acc = 0;
    showOverlay();
    updateHUD();
    if (!fromPause) {
      sfx.start();
      announce('Game started.');
    }
  }

  function pauseGame() {
    if (state !== S.RUNNING) { return; }
    state = S.PAUSED;
    showOverlay();
    updateHUD();
    sfx.pause();
    announce('Game paused.');
  }

  function resumeGame() {
    if (state !== S.PAUSED) { return; }
    startRunning();
  }

  function crash() {
    state = S.OVER;
    if (score > best) {
      best = score;
      saveBest();
    }

    var head = snake[0];
    burst(head.x, head.y, '#FF5A36', 26, 1.5);
    burst(head.x, head.y, '#B7FF3A', 12, 1.1);
    shake = reduceMotion ? 0 : 11;
    bloom = 0.6;
    sfx.crash();

    updateHUD();

    if (reduceMotion) {
      showOverlay();
    } else {
      dyingTimer = 520;
      window.setTimeout(function () {
        if (state === S.OVER) {
          frameEl.classList.remove('pulse');
          boardEl.classList.remove('pulse');
          void frameEl.offsetWidth;
          frameEl.classList.add('pulse');
          boardEl.classList.add('pulse');
        }
      }, 380);
    }

    announce('Game over. Score ' + score + '. Best ' + best + '.');
  }

  /* ================= input: steering ================= */
  function queueDirection(nx, ny) {
    if (queue.length >= 2) { return; }
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (ref.x === -nx && ref.y === -ny) { return; }
    if (ref.x === nx && ref.y === ny) { return; }
    queue.push({ x: nx, y: ny });
    if (turnCooldown <= 0 && state === S.RUNNING) {
      sfx.turn();
      turnCooldown = 45;
    }
  }

  function steer(nx, ny) {
    if (state === S.OVER) {
      toReady();
    }
    if (state === S.START) {
      toReady();
    }
    if (state === S.READY) {
      queueDirection(nx, ny);
      startRunning();
      return;
    }
    if (state === S.RUNNING) {
      queueDirection(nx, ny);
    }
  }

  function primaryAction() {
    if (state === S.START) {
      toReady();
      startRunning();
    } else if (state === S.READY) {
      startRunning();
    } else if (state === S.RUNNING) {
      pauseGame();
    } else if (state === S.PAUSED) {
      resumeGame();
    } else if (state === S.OVER) {
      toReady();
      startRunning();
    }
  }

  /* ================= simulation ================= */
  function tick() {
    if (queue.length) {
      var next = queue.shift();
      if (!(next.x === -dir.x && next.y === -dir.y)) {
        dir = next;
      }
    }

    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= SIZE || ny >= SIZE) {
      crash();
      return;
    }

    var grow = (nx === food.x && ny === food.y);
    var limit = grow ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        crash();
        return;
      }
    }

    prevSnake = snake.map(copy);
    snake.unshift({ x: nx, y: ny });

    if (grow) {
      score += 1;
      var wasTier = Math.floor((score - 1) / TIER_STEP);
      var isTier = Math.floor(score / TIER_STEP);

      interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - score * STEP);
      placeFood();

      bloom = 1;
      burst(nx, ny, '#FF5A36', 16, 1);
      burst(nx, ny, '#B7FF3A', 6, 0.7);
      addFloat(nx, ny, '+1', '#FF5A36', 1);
      sfx.eat();

      if (isTier > wasTier && isTier <= MAX_TIER) {
        addFloat(nx, ny - 1, 'SPEED UP', '#B7FF3A', 1.25);
        sfx.tier();
        if (!reduceMotion) {
          boardEl.classList.remove('flash');
          void boardEl.offsetWidth;
          boardEl.classList.add('flash');
        }
        announce('Speed tier ' + Math.min(MAX_TIER, isTier + 1) + '.');
      } else {
        announce('Food collected. Score ' + score + '.');
      }
    } else {
      snake.pop();
    }

    updateHUD();
  }

  /* ================= main loop ================= */
  function frame(now) {
    window.requestAnimationFrame(frame);

    if (!last) { last = now; }
    var dt = Math.min(70, now - last);
    last = now;

    if (state === S.RUNNING) {
      acc += dt;
      var guard = 0;
      while (acc >= interval && guard < 6) {
        acc -= interval;
        guard += 1;
        tick();
        if (state !== S.RUNNING) {
          acc = 0;
          break;
        }
      }
    } else {
      acc = 0;
    }

    updateEffects(dt);
    draw(now);
  }

  /* ================= keyboard ================= */
  var ARROWS = {
    ArrowUp: [0, -1],
    ArrowDown: [0, 1],
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0]
  };

  function firstGesture() {
    warmAudio();
    window.removeEventListener('keydown', firstGesture);
    window.removeEventListener('pointerdown', firstGesture);
    window.removeEventListener('touchstart', firstGesture);
  }
  window.addEventListener('keydown', firstGesture);
  window.addEventListener('pointerdown', firstGesture);
  window.addEventListener('touchstart', firstGesture, { passive: true });

  document.addEventListener('keydown', function (e) {
    var k = e.key;

    if (ARROWS[k]) {
      e.preventDefault();
      steer(ARROWS[k][0], ARROWS[k][1]);
      return;
    }

    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (state === S.START) { toReady(); return; }
      if (state === S.OVER) { toReady(); announce('Restarted.'); return; }
      if (state === S.PAUSED) { resumeGame(); return; }
      return;
    }

    if (k === 'p' || k === 'P') {
      e.preventDefault();
      if (state === S.RUNNING) { pauseGame(); }
      else if (state === S.PAUSED) { resumeGame(); }
      return;
    }

    if (k === 'r' || k === 'R') {
      e.preventDefault();
      toReady();
      announce('Restarted.');
      return;
    }

    if (k === 'm' || k === 'M') {
      e.preventDefault();
      toggleSound();
    }
  }, { passive: false });

  /* ================= touch: board gestures ================= */
  var swipe = null;

  function bindPress(el, fn) {
    if (!el) { return; }
    if (window.PointerEvent) {
      el.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        el.classList.add('hit');
        window.setTimeout(function () { el.classList.remove('hit'); }, 110);
        fn(e);
      }, { passive: false });
    } else {
      el.addEventListener('touchstart', function (e) {
        e.preventDefault();
        el.classList.add('hit');
        window.setTimeout(function () { el.classList.remove('hit'); }, 110);
        fn(e);
      }, { passive: false });
      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        fn(e);
      });
    }
  }

  boardEl.addEventListener('touchstart', function (e) {
    warmAudio();
    if (e.touches.length > 1) {
      swipe = null;
      return;
    }
    var t = e.touches[0];
    swipe = {
      x: t.clientX,
      y: t.clientY,
      startX: t.clientX,
      startY: t.clientY,
      moved: 0,
      time: performance.now()
    };
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (!swipe || e.touches.length > 1) { return; }
    if (e.cancelable) { e.preventDefault(); }

    var t = e.touches[0];
    var dx = t.clientX - swipe.x;
    var dy = t.clientY - swipe.y;
    var ax = Math.abs(dx);
    var ay = Math.abs(dy);
    var max = Math.max(ax, ay);

    swipe.moved = Math.max(swipe.moved, Math.abs(t.clientX - swipe.startX), Math.abs(t.clientY - swipe.startY));

    if (max >= SWIPE_MIN) {
      if (ax >= ay) {
        steer(dx > 0 ? 1 : -1, 0);
      } else {
        steer(0, dy > 0 ? 1 : -1);
      }
      swipe.x = t.clientX;
      swipe.y = t.clientY;
    }
  }, { passive: false });

  function endTouch(e) {
    if (!swipe) { return; }
    var dt = performance.now() - swipe.time;
    if (swipe.moved <= TAP_MAX_DIST && dt <= TAP_MAX_TIME) {
      primaryAction();
    }
    swipe = null;
    if (e && e.cancelable) { e.preventDefault(); }
  }

  boardEl.addEventListener('touchend', endTouch, { passive: false });
  boardEl.addEventListener('touchcancel', function () { swipe = null; }, { passive: true });

  /* block iOS pinch-zoom only on the play surface */
  boardEl.addEventListener('gesturestart', function (e) {
    e.preventDefault();
  });
  boardEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  /* mouse fallback for the board on desktop: click pauses */
  boardEl.addEventListener('mousedown', function (e) {
    if (device.touch) { return; }
    if (e.target && e.target.closest && e.target.closest('[data-act]')) { return; }
    if (state === S.RUNNING) { pauseGame(); }
  });

  /* ================= touch: d-pad ================= */
  var padButtons = document.querySelectorAll('.pad[data-dir]');
  Array.prototype.forEach.call(padButtons, function (btn) {
    var parts = (btn.getAttribute('data-dir') || '').split(',');
    var dx = parseInt(parts[0], 10) || 0;
    var dy = parseInt(parts[1], 10) || 0;
    bindPress(btn, function () {
      warmAudio();
      steer(dx, dy);
    });
  });

  bindPress(padMid, function () {
    warmAudio();
    primaryAction();
  });

  /* ================= touch: overlay + toggles ================= */
  overlayEl.addEventListener('click', function (e) {
    var target = e.target;
    var btn = target && target.closest ? target.closest('[data-act]') : null;
    if (!btn) { return; }
    var act = btn.getAttribute('data-act');
    warmAudio();
    if (act === 'start') {
      toReady();
      startRunning();
    } else if (act === 'restart') {
      toReady();
      startRunning();
      announce('Restarted.');
    } else if (act === 'resume') {
      resumeGame();
    }
  });

  soundBtn.addEventListener('click', function () {
    warmAudio();
    toggleSound();
  });

  hapticBtn.addEventListener('click', toggleHaptic);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === S.RUNNING) { pauseGame(); }
  });

  window.addEventListener('blur', function () {
    if (state === S.RUNNING) { pauseGame(); }
  });

  /* ================= resize / orientation ================= */
  var resizeTimer = 0;
  function handleResize() {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      syncDevice();
      resize();
      showOverlay();
    }, 80);
  }

  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', function () {
    window.setTimeout(handleResize, 220);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleResize);
  }

  if (mqCoarse && mqCoarse.addEventListener) {
    mqCoarse.addEventListener('change', handleResize);
  } else if (mqCoarse && mqCoarse.addListener) {
    mqCoarse.addListener(handleResize);
  }

  /* ================= boot ================= */
  syncDevice();
  resetGame();
  state = S.START;
  resize();
  showOverlay();
  updateHUD();
  announce('Snake ready. Press enter to start.');

  if (!reduceMotion) {
    boardEl.classList.add('boot');
    var scan = document.createElement('div');
    scan.className = 'scanline';
    boardEl.appendChild(scan);
    window.setTimeout(function () {
      if (scan.parentNode) { scan.parentNode.removeChild(scan); }
      boardEl.classList.remove('boot');
    }, 560);
  }

  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
